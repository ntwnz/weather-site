<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="src/styles/styles.css">
    <title>Document</title>
</head>
<body>
    <div id="container">
        <form id="search">
            <i id="map_icon" class="fas fa-map-marked-alt"></i>
            <input type="search" name="city_name" id="city_name" placeholder="Pesquisar cidade">
            <button type="submit">
                <i id="search_icon" class="fas fa-search-location"></i>    
            </button>
        </form>

        <div id="weather">
            <h1 id="title">Ponta Grossa</h1>
        <div id="info">
            <div id="temp">
                <img id="temp_img" src="https://www.gstatic.com/weather/conditions/v1/svg/strong_thunderstorms_light.svg" alt="">
                <div>
                <p id="temp_value">
                  28 C°  
                </p>
                <p id="temp_description">
                    Nublado com Trovões
                </p>
                </div>
            </div>
        </div>
        <div id="other_info">
            <div class="info">
                <i id="temp_max_icon" class="fas fa-temperature-high"></i>
                <div>
                    <h2>Temp. max</h2>
                    <p id="temp_max">35°C</p>
                </div>
            </div>
            <div class="info">
                <i id="temp_min_icon" class="fas fa-temperature-low"></i>
                <div>
                    <h2>Temp. min</h2>
                    <p id="temp_min">22°C</p>
                </div>
            </div>
            <div class="info">
                <i id="humidity_icon" class="fas fa-tint"></i>
                 <div>
                    <h2>Umidade</h2>
                    <p id="humidity">42%</p>
                </div>
            </div>
            <div class="info">
                <i id="wind_icon" class="fas fa-wind"></i>
                 <div>
                    <h2>Vento</h2>
                    <p id="wind">7 nós Sudoeste</p>
                </div>
            </div>
            </div>
        </div>
        <div id="alert"></div>
        </div>
    </div>
    <script src="src/javascript/script.js"></script>
</body>
</html>
